name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Базовые права токена для всех job'ов — только чтение репозитория.
# Job'у deploy этого мало, он расширяет права своим блоком permissions.
permissions:
  contents: read

# Все сторонние экшены закреплены по полному коммит-SHA: мутабельный тег (v4, v1) владелец
# экшена может передвинуть на любой коммит, а шаг деплоя отдаёт экшену ключ от сервера.
# Версия оставлена в комментарии — по нему Dependabot продолжает обновлять экшены.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test -B

      # Отчёт о покрытии (JaCoCo) — артефакт PR, скачивается из вкладки Actions.
      # always() — выгружаем даже если тесты упали, чтобы видеть частичное покрытие.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────────
  # Деплой. Ключи и адрес сервера берутся из секретов репозитория — в коде их нет
  # и быть не должно. Чтобы job заработал, заведите в Settings:
  #   Secrets → DEPLOY_HOST     — адрес сервера
  #   Secrets → DEPLOY_USER     — пользователь для SSH
  #   Secrets → DEPLOY_SSH_KEY  — приватный ключ этого пользователя
  #   Variables → DEPLOY_ENABLED = true
  #
  # Отдельный флаг-переменная, а не «просто проверить секреты»: контекст secrets в
  # условии job'а недоступен, и без флага job запускался бы всегда и падал на шаге
  # подключения у любого, кто просто склонировал репозиторий. Падение деплоя при этом
  # неотличимо от падения тестов — красный CI перестаёт что-либо значить.
  # ────────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      packages: write

    env:
      DEPLOY_PATH: /opt/subscription-service
      CONTAINER: subscriptions-app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Кроме :latest вешаем неизменяемый тег с SHA коммита — по нему можно откатиться
      # на конкретную сборку. :latest остаётся: на него завязаны скрипт деплоя и проверка
      # «не залип ли старый образ».
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        # Токен и логин уезжают на сервер через envs (экшен экспортирует их в удалённой
        # сессии), а не подстановкой ${{ }} в текст скрипта — иначе секрет оказывается
        # в командной строке и в history на сервере.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          CONTAINER: ${{ env.CONTAINER }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_PATH,CONTAINER,IMAGE
          script: |
            set -e
            # Гасим docker-креды реестра на выходе в любом случае, в том числе когда ниже
            # сработает проверка на залипший образ и скрипт выйдет с ошибкой.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            cd "$DEPLOY_PATH"
            # Retry login — реестр изредка отдаёт TLS handshake timeout.
            login_ok=0
            for i in 1 2 3; do
              if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then login_ok=1; break; fi
              echo "docker login attempt $i failed, retry in 5s"; sleep 5
            done
            [ "$login_ok" = 1 ] || { echo "::error::docker login to ghcr failed after 3 attempts"; exit 1; }
            # Retry pull — без этого упавший pull молча оставлял старый образ.
            pull_ok=0
            for i in 1 2 3; do
              if docker compose -f docker-compose.prod.yml pull app; then pull_ok=1; break; fi
              echo "docker pull attempt $i failed, retry in 5s"; sleep 5
            done
            [ "$pull_ok" = 1 ] || { echo "::error::docker pull of app image failed after 3 attempts"; exit 1; }
            docker compose -f docker-compose.prod.yml up -d --force-recreate app
            docker image prune -f
            # Fail loudly, если запущенный образ не совпал с :latest (защита от тихого
            # деплоя старого образа при частично прошедшем pull).
            RUNNING=$(docker inspect "$CONTAINER" --format '{{.Image}}')
            LATEST=$(docker inspect "$IMAGE:latest" --format '{{.Id}}')
            [ "$RUNNING" = "$LATEST" ] || { echo "::error::running image ($RUNNING) != :latest ($LATEST) — stale deploy"; exit 1; }
            # Совпадение образа говорит только о том, что подняли ЧТО НАДО, а не о том, что оно
            # работает. HEALTHCHECK в образе есть, но его исход надо прочитать: битая миграция,
            # пропавшая env или непарсящийся app-dynamic.yml дают crash-loop при зелёном деплое,
            # и без этой проверки об этом узнают от клиентов.
            #
            # Отката здесь нет намеренно: контейнер уже пересоздан на новом образе, и авто-возврат
            # на предыдущий SHA превратил бы флапающий баг в бесконечное качание. Задача шага —
            # не соврать. Ручной откат: перетегировать нужный <image>:<sha> в :latest и повторить
            # docker compose -f docker-compose.prod.yml up -d --force-recreate app.
            echo "Ждём, пока $CONTAINER сообщит healthy…"
            i=0
            while [ "$i" -lt 48 ]; do
              HS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER" 2>/dev/null || echo missing)
              if [ "$HS" = "healthy" ]; then
                echo "$CONTAINER healthy через $((i * 5))s"
                break
              fi
              if [ "$HS" = "none" ]; then
                echo "::error::у образа нет HEALTHCHECK — подтвердить деплой нечем"; exit 1
              fi
              if [ "$HS" = "unhealthy" ] || [ "$HS" = "missing" ]; then
                echo "::error::$CONTAINER в состоянии '$HS' после деплоя"
                docker logs --tail 120 "$CONTAINER" 2>&1 || true
                exit 1
              fi
              i=$((i + 1))
              sleep 5
            done
            if [ "$i" -ge 48 ]; then
              echo "::error::$CONTAINER не стал healthy за 240s (последний статус: $HS)"
              docker logs --tail 120 "$CONTAINER" 2>&1 || true
              exit 1
            fi
            echo "Deploy OK, running image: $RUNNING"
