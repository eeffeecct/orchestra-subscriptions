# Редакция оферты, действовавшая в момент акцепта.
#
# Зачем, если рядом уже лежит offer_url. Адрес на Telegraph постоянный, а ТЕКСТ по нему
# правится на месте: после первой же правки запись «согласился 15.08.2026, вот адрес»
# доказывает согласие с документом по этому адресу, но не с той редакцией, которая
# действовала в тот момент. На спор «я соглашался на другие условия» предъявить нечего.
#
# Значение берётся из app.telegram.offer-revision — это строка, которую владелец меняет
# ОДНОВРЕМЕННО с правкой текста оферты (обычно дата редакции, «2026-08-21»). Одна строка
# конфига, зато все последующие акцепты становятся отличимы от прежних.
#
# Nullable намеренно: у акцептов, собранных до этой миграции, редакции не было и выдумывать
# её нельзя — пустое поле честно значит «неизвестно», а не «первая редакция». По той же
# причине не задаётся defaultValue.
databaseChangeLog:
  - changeSet:
      id: 034-add-offer-revision
      author: eeffeecct
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: offer_acceptances
                columnName: offer_revision
      changes:
        - addColumn:
            tableName: offer_acceptances
            columns:
              - column:
                  name: offer_revision
                  type: VARCHAR(64)
