# ──────────────────────────────────────────────────────────────────────────
# Профиль «без long polling»: приложение поднимается целиком, но НЕ регистрирует
# бота в Telegram.
#
# Зачем. Стартер long-polling проверяет токен на старте и при неверном отвечает 401,
# роняя весь контекст. Для человека, который только что склонировал репозиторий и ещё
# не заводил своего бота, это означало бы «ничего не запускается» — при том что база,
# миграции, REST API, Mini App и веб-кабинет к боту отношения не имеют.
#
# Что выключено: ТОЛЬКО автоконфигурация стартера, то есть сама подписка на обновления.
# Бин SubscriptionBot остаётся в контексте, и все зависящие от него сервисы стартуют
# как обычно; исходящие вызовы Telegram просто уйдут в никуда.
#
# Как включить бота: получить токен у @BotFather, положить его в BOT_TOKEN и убрать
# профиль (в docker-compose.yml — SPRING_PROFILES_ACTIVE=).
#
# Тот же приём используют тесты (src/test/resources/application.yml) — по той же причине.
# ──────────────────────────────────────────────────────────────────────────
spring:
  autoconfigure:
    exclude: org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
